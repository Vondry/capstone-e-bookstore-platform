# Local PostgreSQL for the Medusa backend in backend/ (plan docs/plans/14-backend-medusa.md).
# Start: docker compose up -d   ·   Stop: docker compose down   ·   Reset data: docker compose down -v
# Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookworm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: bookworm
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medusa -d bookworm']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
